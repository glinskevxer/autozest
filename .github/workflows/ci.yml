name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONDONTWRITEBYTECODE: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  lint:
    name: lint and types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: install
        run: python -m pip install -e ".[dev]"
      - name: ruff check
        run: python -m ruff check .
      - name: ruff format
        run: python -m ruff format --check .
      - name: mypy
        run: python -m mypy

  test:
    name: python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: install
        run: python -m pip install -e ".[dev]"
      - name: pytest with a coverage floor
        run: python -m pytest -q --cov=src/autozest --cov-report=term-missing

  migrations:
    name: migrations apply forwards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: install
        run: python -m pip install -e ".[dev]"
      - name: check the shipped migrations
        run: python -m autozest.tools.check_migrations
      - name: check the query plans
        run: python -m autozest.tools.explain
      - name: release checks
        run: python -m autozest.tools.release

  cli:
    name: the command line works
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: install
        run: python -m pip install .
      - name: build a sale, settle it, and check the whole thing over
        run: |
          set -euo pipefail
          az --db "$RUNNER_TEMP/ci.sqlite3" init
          az --db "$RUNNER_TEMP/ci.sqlite3" admin seed --units 24
          az --db "$RUNNER_TEMP/ci.sqlite3" admin check
          az --db "$RUNNER_TEMP/ci.sqlite3" admin health
          az --db "$RUNNER_TEMP/ci.sqlite3" report recap S-20240312
          az --db "$RUNNER_TEMP/ci.sqlite3" report reference
          az --db "$RUNNER_TEMP/ci.sqlite3" settle post S-20240312
          az --db "$RUNNER_TEMP/ci.sqlite3" settle trial-balance
          az --db "$RUNNER_TEMP/ci.sqlite3" report dashboard --sale S-20240312
          az --db "$RUNNER_TEMP/ci.sqlite3" report concentration S-20240312
          az --db "$RUNNER_TEMP/ci.sqlite3" admin doctor
          az --db "$RUNNER_TEMP/ci.sqlite3" admin verify
          az --db "$RUNNER_TEMP/ci.sqlite3" admin plans
          az --db "$RUNNER_TEMP/ci.sqlite3" admin sizes

  audit:
    name: dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: install
        run: python -m pip install -e ".[dev]" pip-audit==2.7.3
      - name: audit the installed dependencies
        # --skip-editable leaves out autozest itself. It is installed from this
        # checkout and is not on PyPI, so auditing it can only ever report that
        # it was not found. Not --strict: --strict fails the run on anything
        # skipped, which is exactly the line above, so the two contradict each
        # other. A real advisory against a real dependency still exits non zero.
        run: python -m pip_audit --skip-editable --progress-spinner off

  docs:
    name: the manual and the card build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: install
        run: python -m pip install .
      - name: write the manual and the reference card
        run: |
          set -euo pipefail
          mkdir -p build/docs
          az --db "$RUNNER_TEMP/docs.sqlite3" init
          az --db "$RUNNER_TEMP/docs.sqlite3" admin manual --out build/docs/manual.txt
          az --db "$RUNNER_TEMP/docs.sqlite3" report reference > build/docs/reference.txt
          az --db "$RUNNER_TEMP/docs.sqlite3" admin history > build/docs/history.txt
          wc -l build/docs/*.txt
      - name: keep them
        uses: actions/upload-artifact@v4
        with:
          name: docs
          path: build/docs
          retention-days: 14

  package:
    name: it builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install build
        run: python -m pip install build==1.2.2
      - name: build the wheel and the sdist
        run: python -m build
      - name: check what went in
        run: |
          set -euo pipefail
          python -m pip install dist/*.whl
          python -c "import autozest; print(autozest.__version__)"
          az --help > /dev/null
