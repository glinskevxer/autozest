[build-system]
requires = ["hatchling==1.18.0"]
build-backend = "hatchling.build"

[project]
name = "autozest"
version = "0.1.0"
description = "Consignment, block and settlement system for a wholesale vehicle auction"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "glinskevxer", email = "roym78109@gmail.com" }]
dependencies = ["click==8.1.7"]

[project.optional-dependencies]
dev = ["pytest==7.4.3", "pytest-cov==4.1.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/autozest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 96
target-version = "py311"
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
files = ["src", "tests"]
strict = true
