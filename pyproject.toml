[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "autozest"
version = "0.1.0"
description = "Consignment, block and settlement system for a wholesale vehicle auction"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [{ name = "glinskevxer", email = "roym78109@gmail.com" }]
dependencies = ["click==8.1.8"]

[project.scripts]
az = "autozest.cli.main:main"

[project.urls]
Homepage = "https://github.com/glinskevxer/autozest"



[project.optional-dependencies]
dev = [
    "pytest==8.3.5",
    "pytest-cov==6.0.0",
    "coverage==7.6.12",
    "ruff==0.9.10",
    "mypy==1.15.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/autozest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
filterwarnings = ["error"]

[tool.ruff]
line-length = 96
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM", "RET", "RUF", "PTH", "TID", "ARG"]
ignore = ["RUF012", "ARG002"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["RUF001", "ARG001"]

[tool.mypy]
python_version = "3.12"
files = ["src", "tests"]
strict = true
warn_unreachable = true

[tool.coverage.run]
source = ["src/autozest"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
# The floor is what the suite already reaches, less a little room. A floor set
# above where the code is on the day it is added is a floor somebody turns off.
fail_under = 95
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    'if __name__ == "__main__":',
]
